<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Test E reproduit</title>
<style>
  body { font-family: -apple-system, sans-serif; padding: 20px; background: #111; color: #eee; }
  button { font-size: 18px; padding: 16px; width: 100%; margin: 10px 0; border-radius: 8px; border: none; background: #4f8cff; color: white; }
  pre { background: #222; padding: 12px; border-radius: 8px; font-size: 12px; white-space: pre-wrap; word-break: break-all; }
</style>
</head>
<body>
<h1>Test E v2</h1>
<p>Doit ouvrir le sélecteur et afficher ton rameur.</p>

<button id="btn">Se connecter (Test E inline)</button>
<button id="btn2">Se connecter (Test E via addEventListener)</button>

<pre id="out">Prêt.</pre>

<script>
const out = document.getElementById('out');
function log(m) { out.textContent += '\n' + m; }

log('JS chargé.');
log('navigator.bluetooth : ' + (navigator.bluetooth ? 'OUI' : 'NON'));

async function doConnect(label) {
  log('▶ ' + label + ' — tap détecté');
  try {
    const device = await navigator.bluetooth.requestDevice({
      filters: [{ services: ['00001826-0000-1000-8000-00805f9b34fb'] }]
    });
    log('✓ ' + (device.name || '(sans nom)'));
  } catch (e) {
    log('✗ ' + (e && e.message ? e.message : (e === undefined ? 'undefined' : String(e))));
  }
}

document.getElementById('btn').onclick = () => doConnect('onclick=');
document.getElementById('btn2').addEventListener('click', () => doConnect('addEventListener'));
log('Boutons attachés.');
</script>
</body>
</html>
