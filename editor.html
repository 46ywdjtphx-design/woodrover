<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Éditeur · Rameur Woodrover</title>
<link rel="stylesheet" href="style.css">
<style>
  body { padding-top: 0; }
  .app {
    display: grid;
    grid-template-columns: 320px 1fr;
    height: 100vh;
    max-height: 100vh;
    overflow: hidden;
  }
  /* ===== Sidebar gauche ===== */
  .sidebar {
    background: var(--surface);
    border-right: 1px solid var(--border);
    overflow-y: auto;
    display: flex; flex-direction: column;
    box-shadow: 1px 0 4px rgba(0,0,0,0.03);
  }
  .sidebar-header {
    padding: 16px;
    border-bottom: 1px solid var(--border-soft);
    display: flex; flex-direction: column; gap: 8px;
    position: sticky; top: 0;
    background: var(--surface);
    z-index: 10;
  }
  .sidebar-header h1 {
    margin: 0;
    font-size: 16px;
    display: flex; align-items: center; gap: 6px;
  }
  .sidebar-header h1 a {
    color: var(--text-dim);
    text-decoration: none;
    font-weight: 400;
  }
  .sidebar-actions { display: flex; gap: 6px; flex-wrap: wrap; }
  .sidebar-list { padding: 8px; flex: 1; }
  .workout-item {
    padding: 12px;
    border-radius: var(--radius-sm);
    margin-bottom: 4px;
    cursor: pointer;
    border: 1px solid transparent;
    transition: background 0.1s;
  }
  .workout-item:hover { background: var(--surface-2); }
  .workout-item.active {
    background: var(--accent-dim);
    border-color: var(--accent);
  }
  .workout-item .wn-name {
    font-size: 14px;
    font-weight: 500;
    margin-bottom: 2px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .workout-item .wn-meta {
    font-size: 11px;
    color: var(--text-dim);
  }
  .empty-state {
    padding: 32px 16px;
    text-align: center;
    color: var(--text-dim);
    font-size: 13px;
  }

  /* ===== Main ===== */
  .main {
    overflow-y: auto;
    padding: 24px 32px;
  }
  .editor-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 20px;
    gap: 16px;
    flex-wrap: wrap;
  }
  .editor-title {
    display: flex; align-items: center; gap: 8px;
    flex: 1; min-width: 200px;
  }
  .editor-title input {
    font-size: 22px; font-weight: 600;
    background: transparent;
    border: none;
    border-bottom: 1px dashed transparent;
    padding: 4px 0;
    flex: 1;
    color: var(--text);
  }
  .editor-title input:hover { border-bottom-color: var(--border); }
  .editor-title input:focus {
    border-bottom-color: var(--accent);
    box-shadow: none;
  }

  .editor-stats {
    display: flex; gap: 24px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 12px 20px;
    box-shadow: var(--shadow);
  }
  .stat-item { display: flex; flex-direction: column; }
  .stat-item .stat-lbl {
    font-size: 11px; color: var(--text-dim);
    text-transform: uppercase; letter-spacing: 0.04em;
  }
  .stat-item .stat-val {
    font-size: 18px; font-weight: 600;
    font-variant-numeric: tabular-nums;
  }

  /* ===== Graph (plus grand qu'avant) ===== */
  .graph-container {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 16px 20px;
    margin-bottom: 24px;
    box-shadow: var(--shadow);
  }
  .graph {
    position: relative;
    height: 280px;
    border-bottom: 1px solid var(--border);
    border-left: 1px solid var(--border);
    margin: 12px 0 4px;
    display: flex;
    align-items: flex-end;
    background: linear-gradient(to top, var(--surface-2) 0%, var(--surface) 100%);
  }
  .graph-empty {
    width: 100%;
    text-align: center;
    color: var(--text-muted);
    font-size: 13px;
    padding: 100px 0;
  }
  .graph-bar {
    position: relative;
    margin-right: 1px;
    color: white;
    font-size: 11px;
    font-weight: 600;
    transition: filter 0.15s;
    display: flex;
    align-items: flex-start;
    justify-content: center;
    padding-top: 4px;
    cursor: pointer;
  }
  .graph-bar:hover { filter: brightness(1.1); }
  .graph-axis-label {
    font-size: 10px;
    color: var(--text-dim);
    margin-top: 4px;
  }

  /* ===== Blocks list ===== */
  .blocks-section {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 16px 20px;
    box-shadow: var(--shadow);
  }
  .blocks-section h2 {
    margin: 0 0 12px;
    font-size: 13px;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--text-dim);
    font-weight: 600;
  }
  .blocks-header {
    display: grid;
    grid-template-columns: 36px 1fr 1fr 1fr 36px;
    gap: 12px;
    align-items: center;
    padding: 6px 12px;
    font-size: 11px;
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: 0.05em;
  }
  .block-row {
    display: grid;
    grid-template-columns: 36px 1fr 1fr 1fr 36px;
    gap: 12px;
    align-items: center;
    padding: 8px 12px;
    background: var(--surface-2);
    border-radius: var(--radius-sm);
    margin-bottom: 4px;
    transition: background 0.15s, opacity 0.15s;
    border: 1px solid transparent;
  }
  .block-row:hover { background: var(--surface-3); border-color: var(--border-soft); }
  .block-row.dragging { opacity: 0.4; }
  .block-row.drag-over { box-shadow: 0 -2px 0 var(--accent); }
  .block-handle {
    cursor: grab;
    color: var(--text-muted);
    font-size: 18px;
    text-align: center;
    user-select: none;
  }
  .block-handle:active { cursor: grabbing; }
  .block-input {
    width: 100%;
  }
  .level-control {
    display: flex; align-items: center; gap: 4px;
  }
  .level-control input { flex: 1; text-align: center; }
  .level-control button { padding: 4px 8px; font-size: 14px; min-width: 28px; }

  .blocks-empty {
    padding: 24px;
    text-align: center;
    color: var(--text-dim);
    font-size: 13px;
    background: var(--surface-2);
    border-radius: var(--radius-sm);
    margin-bottom: 12px;
  }

  .blocks-actions {
    display: flex; gap: 8px;
    margin-top: 12px;
    flex-wrap: wrap;
  }

  .no-workout-selected {
    text-align: center;
    padding: 80px 20px;
    color: var(--text-dim);
  }
  .no-workout-selected .big-emoji { font-size: 56px; margin-bottom: 16px; }

  @media (max-width: 800px) {
    .app { grid-template-columns: 1fr; height: auto; }
    .sidebar { max-height: 50vh; border-right: none; border-bottom: 1px solid var(--border); }
    .main { padding: 16px; }
    .editor-stats { width: 100%; justify-content: space-around; }
    .graph { height: 200px; }
  }
</style>
</head>
<body>
<div class="app">

  <aside class="sidebar">
    <div class="sidebar-header">
      <h1><a href="index.html">←</a> Entraînements</h1>
      <div class="sidebar-actions">
        <button class="primary small" id="btn-new">+ Nouveau</button>
        <button class="small" id="btn-import">Importer</button>
        <button class="small" id="btn-export">Exporter</button>
      </div>
    </div>
    <div class="sidebar-list" id="sidebar-list">
      <div class="empty-state">Aucun entraînement.<br>Crée-en un avec « + Nouveau ».</div>
    </div>
  </aside>

  <main class="main" id="main">
    <div class="no-workout-selected">
      <div class="big-emoji">🚣</div>
      <p>Sélectionne un entraînement dans la liste<br>ou crée-en un nouveau.</p>
    </div>
  </main>
</div>

<input type="file" id="import-file" accept=".json,application/json" style="display:none">

<script src="app.js"></script>
<script>
(function() {
  'use strict';
  const { Storage, Blocks, Utils, Toast, BLE } = RameurApp;

  let currentId = null;
  let currentWorkout = null;

  function renderSidebar() {
    const list = document.getElementById('sidebar-list');
    const workouts = Storage.getAll();
    if (workouts.length === 0) {
      list.innerHTML = '<div class="empty-state">Aucun entraînement.<br>Crée-en un avec « + Nouveau ».</div>';
      return;
    }
    workouts.sort(function(a,b){ return (b.updatedAt||0) - (a.updatedAt||0); });
    list.innerHTML = '';
    workouts.forEach(function(w) {
      const total = Blocks.totalDuration(w);
      const item = document.createElement('div');
      item.className = 'workout-item' + (w.id === currentId ? ' active' : '');
      item.dataset.id = w.id;
      item.innerHTML =
        '<div class="wn-name"></div>' +
        '<div class="wn-meta">' + w.blocks.length + ' blocs · ' + Utils.fmtTime(total) + '</div>';
      item.querySelector('.wn-name').textContent = w.name;
      item.addEventListener('click', function(){ selectWorkout(w.id); });
      list.appendChild(item);
    });
  }

  function selectWorkout(id) {
    currentId = id;
    currentWorkout = Storage.get(id);
    if (!currentWorkout) {
      currentId = null;
      renderSidebar();
      renderMain();
      return;
    }
    renderSidebar();
    renderMain();
  }

  function persist() {
    if (!currentWorkout) return;
    Storage.save(currentWorkout);
    renderSidebar();
  }

  function renderMain() {
    const main = document.getElementById('main');
    if (!currentWorkout) {
      main.innerHTML =
        '<div class="no-workout-selected">' +
          '<div class="big-emoji">🚣</div>' +
          '<p>Sélectionne un entraînement dans la liste<br>ou crée-en un nouveau.</p>' +
        '</div>';
      return;
    }

    const w = currentWorkout;
    const total = Blocks.totalDuration(w);
    const avgLevel = w.blocks.length === 0 ? 0
      : w.blocks.reduce(function(s,b){ return s + (b.level * b.duration); }, 0) / Math.max(1, total);

    main.innerHTML = `
      <div class="editor-header">
        <div class="editor-title">
          <input type="text" id="title-input" placeholder="Nom de l'entraînement">
        </div>
        <div class="editor-stats">
          <div class="stat-item"><span class="stat-lbl">Blocs</span><span class="stat-val" id="stat-blocks"></span></div>
          <div class="stat-item"><span class="stat-lbl">Durée totale</span><span class="stat-val" id="stat-duration"></span></div>
          <div class="stat-item"><span class="stat-lbl">Intensité moy.</span><span class="stat-val" id="stat-avg"></span></div>
        </div>
        <div style="display:flex;gap:6px">
          <button class="small" id="btn-duplicate" title="Dupliquer">📋</button>
          <button class="small danger" id="btn-delete" title="Supprimer">🗑</button>
        </div>
      </div>

      <div class="graph-container">
        <div id="graph" class="graph"></div>
        <div style="display:flex;justify-content:space-between;font-size:11px;color:var(--text-dim);margin-top:4px;">
          <span>0:00</span>
          <span class="digital">${Utils.fmtTime(total)}</span>
        </div>
      </div>

      <div class="blocks-section">
        <h2>Blocs</h2>
        <div class="blocks-header">
          <span></span>
          <span>Durée</span>
          <span>Niveau (1-15)</span>
          <span>Cumul</span>
          <span></span>
        </div>
        <div id="blocks-list"></div>
        <div class="blocks-actions">
          <button class="primary" id="btn-add-block">+ Ajouter un bloc</button>
          <button id="btn-add-5x60">+ Échauffement 5min @ niv 4</button>
          <button id="btn-add-interval">+ 4 × (1min @8, 1min @4)</button>
        </div>
      </div>
    `;

    const titleInput = document.getElementById('title-input');
    titleInput.value = w.name;
    titleInput.addEventListener('change', function() {
      w.name = titleInput.value.trim() || 'Sans titre';
      persist();
    });

    document.getElementById('stat-blocks').textContent = w.blocks.length;
    document.getElementById('stat-duration').textContent = Utils.fmtTime(total);
    document.getElementById('stat-avg').textContent = w.blocks.length === 0 ? '—' : (Math.round(avgLevel * 10) / 10);

    document.getElementById('btn-duplicate').addEventListener('click', function(){
      const copy = Storage.duplicate(w.id);
      if (copy) { Toast.success('Entraînement dupliqué'); selectWorkout(copy.id); }
    });
    document.getElementById('btn-delete').addEventListener('click', function(){
      if (confirm('Supprimer l\'entraînement « ' + w.name + ' » ?')) {
        Storage.delete(w.id);
        currentId = null; currentWorkout = null;
        renderSidebar(); renderMain();
        Toast.success('Supprimé');
      }
    });

    document.getElementById('btn-add-block').addEventListener('click', function() {
      w.blocks.push(Blocks.create(60, 5));
      persist(); renderMain();
    });
    document.getElementById('btn-add-5x60').addEventListener('click', function() {
      w.blocks.push(Blocks.create(300, 4));
      persist(); renderMain();
    });
    document.getElementById('btn-add-interval').addEventListener('click', function() {
      for (let i = 0; i < 4; i++) {
        w.blocks.push(Blocks.create(60, 8));
        w.blocks.push(Blocks.create(60, 4));
      }
      persist(); renderMain();
    });

    renderGraph();
    renderBlocks();
  }

  function renderGraph() {
    const graph = document.getElementById('graph');
    const w = currentWorkout;
    if (!w || w.blocks.length === 0) {
      graph.innerHTML = '<div class="graph-empty">Ajoute des blocs pour voir le graphique</div>';
      return;
    }
    const total = Blocks.totalDuration(w);
    graph.innerHTML = '';
    w.blocks.forEach(function(b, i) {
      const bar = document.createElement('div');
      bar.className = 'graph-bar';
      bar.dataset.index = i;
      bar.style.width = ((b.duration / total) * 100) + '%';
      const heightPct = 5 + (b.level / 15) * 95;
      bar.style.height = heightPct + '%';
      // Palette adaptée fond clair : bleu doux → orange/rouge intense
      const hue = 220 - (b.level - 1) * 14;
      bar.style.background = 'hsl(' + hue + ', 70%, 55%)';
      bar.title = 'Bloc ' + (i+1) + ' · ' + Utils.fmtTime(b.duration) + ' · niveau ' + b.level;
      if (b.duration >= 30) bar.textContent = b.level;
      bar.addEventListener('click', function() {
        const row = document.querySelector('.block-row[data-index="' + i + '"]');
        if (row) {
          row.scrollIntoView({ behavior: 'smooth', block: 'center' });
          row.style.transition = 'background 0.5s';
          row.style.background = 'var(--accent-dim)';
          setTimeout(function(){ row.style.background = ''; }, 800);
        }
      });
      graph.appendChild(bar);
    });
  }

  function renderBlocks() {
    const list = document.getElementById('blocks-list');
    const w = currentWorkout;
    if (!w || w.blocks.length === 0) {
      list.innerHTML = '<div class="blocks-empty">Aucun bloc. Clique sur « + Ajouter un bloc ».</div>';
      return;
    }
    list.innerHTML = '';
    let cumul = 0;
    w.blocks.forEach(function(b, i) {
      cumul += b.duration;
      const row = document.createElement('div');
      row.className = 'block-row';
      row.draggable = true;
      row.dataset.index = i;
      row.innerHTML = `
        <span class="block-handle" title="Glisser pour réordonner">⋮⋮</span>
        <input type="text" class="block-input block-duration" value="${formatMmSs(b.duration)}" placeholder="mm:ss">
        <div class="level-control">
          <button class="small" data-act="dec">−</button>
          <input type="number" class="block-input block-level" min="1" max="15" value="${b.level}">
          <button class="small" data-act="inc">+</button>
        </div>
        <span style="font-size:12px;color:var(--text-dim);" class="digital">${Utils.fmtTime(cumul)}</span>
        <button class="small danger icon" title="Supprimer">×</button>
      `;
      const durInput = row.querySelector('.block-duration');
      durInput.addEventListener('change', function() {
        const sec = Utils.parseTime(durInput.value);
        b.duration = Math.max(1, sec);
        persist();
        renderMain();
      });
      const lvlInput = row.querySelector('.block-level');
      lvlInput.addEventListener('change', function() {
        const v = parseInt(lvlInput.value, 10) || 1;
        b.level = Math.max(BLE.MIN_LEVEL, Math.min(BLE.MAX_LEVEL, v));
        persist();
        renderMain();
      });
      row.querySelector('[data-act="dec"]').addEventListener('click', function() {
        b.level = Math.max(BLE.MIN_LEVEL, b.level - 1);
        persist(); renderMain();
      });
      row.querySelector('[data-act="inc"]').addEventListener('click', function() {
        b.level = Math.min(BLE.MAX_LEVEL, b.level + 1);
        persist(); renderMain();
      });
      row.querySelector('.danger.icon').addEventListener('click', function() {
        w.blocks.splice(i, 1);
        persist(); renderMain();
      });

      row.addEventListener('dragstart', function(e) {
        e.dataTransfer.effectAllowed = 'move';
        e.dataTransfer.setData('text/plain', String(i));
        row.classList.add('dragging');
      });
      row.addEventListener('dragend', function() {
        row.classList.remove('dragging');
        document.querySelectorAll('.block-row.drag-over').forEach(function(r){ r.classList.remove('drag-over'); });
      });
      row.addEventListener('dragover', function(e) {
        e.preventDefault();
        row.classList.add('drag-over');
      });
      row.addEventListener('dragleave', function() {
        row.classList.remove('drag-over');
      });
      row.addEventListener('drop', function(e) {
        e.preventDefault();
        const fromIdx = parseInt(e.dataTransfer.getData('text/plain'), 10);
        const toIdx = i;
        if (fromIdx === toIdx) return;
        const moved = w.blocks.splice(fromIdx, 1)[0];
        w.blocks.splice(toIdx, 0, moved);
        persist();
        renderMain();
      });

      list.appendChild(row);
    });
  }

  function formatMmSs(seconds) {
    const m = Math.floor(seconds / 60);
    const s = seconds % 60;
    return m + ':' + String(s).padStart(2, '0');
  }

  document.getElementById('btn-new').addEventListener('click', function() {
    const name = prompt('Nom du nouvel entraînement :', 'Nouvel entraînement');
    if (name === null) return;
    const w = Storage.create(name.trim() || 'Sans titre');
    selectWorkout(w.id);
    Toast.success('Entraînement créé');
  });

  document.getElementById('btn-import').addEventListener('click', function() {
    document.getElementById('import-file').click();
  });
  document.getElementById('import-file').addEventListener('change', function(e) {
    const file = e.target.files && e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = function(ev) {
      try {
        const result = Storage.importJson(ev.target.result, 'merge');
        Toast.success(result.imported + ' entraînement(s) importé(s)');
        renderSidebar();
      } catch (err) {
        Toast.error('Erreur d\'import : ' + err.message);
      }
    };
    reader.readAsText(file);
    e.target.value = '';
  });
  document.getElementById('btn-export').addEventListener('click', function() {
    const data = Storage.exportJson();
    const blob = new Blob([data], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const link = document.createElement('a');
    link.href = url;
    const date = new Date().toISOString().slice(0, 10);
    link.download = 'rameur-workouts-' + date + '.json';
    link.click();
    setTimeout(function(){ URL.revokeObjectURL(url); }, 1000);
    Toast.success('Export téléchargé');
  });

  renderSidebar();
  const all = Storage.getAll();
  if (all.length > 0) selectWorkout(all[0].id);
})();
</script>
</body>
</html>
