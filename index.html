<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Rameur Woodrover</title>
<style>
  :root {
    --bg: #0f1115;
    --surface: #1a1d24;
    --surface-2: #232730;
    --text: #e8eaed;
    --text-dim: #9aa0a6;
    --text-muted: #5f6368;
    --accent: #4f8cff;
    --accent-dim: #1e3a6f;
    --success: #34d399;
    --danger: #f87171;
    --warning: #fbbf24;
    --border: #2a2e38;
    --radius: 10px;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0;
    background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif;
    font-size: 16px;
    -webkit-font-smoothing: antialiased;
    min-height: 100vh;
  }
  .app {
    max-width: 600px; margin: 0 auto;
    padding: env(safe-area-inset-top, 16px) 16px env(safe-area-inset-bottom, 16px);
    padding-top: max(env(safe-area-inset-top), 16px);
  }
  header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 12px 0 20px;
  }
  .title { font-size: 20px; font-weight: 600; margin: 0; }
  .subtitle { font-size: 13px; color: var(--text-dim); margin: 2px 0 0; }
  .status-dot {
    width: 12px; height: 12px; border-radius: 50%;
    background: var(--danger); transition: background 0.3s;
  }
  .status-dot.connected { background: var(--success); }
  .status-dot.connecting { background: var(--warning); animation: pulse 1.2s infinite; }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.4} }
  .btn-row { display: flex; gap: 10px; margin-bottom: 20px; }
  button {
    flex: 1;
    appearance: none; -webkit-appearance: none;
    background: var(--surface); color: var(--text);
    border: 1px solid var(--border); border-radius: var(--radius);
    padding: 14px 16px;
    font-size: 15px; font-weight: 500; font-family: inherit;
    cursor: pointer;
    transition: background 0.15s, transform 0.05s;
    -webkit-touch-callout: none; user-select: none;
  }
  button:active:not(:disabled) { transform: scale(0.97); background: var(--surface-2); }
  button:disabled { opacity: 0.4; cursor: not-allowed; }
  button.primary { background: var(--accent); border-color: var(--accent); color: white; }
  button.primary:active:not(:disabled) { background: #3b75db; }
  .metrics-grid {
    display: grid; grid-template-columns: repeat(2, 1fr);
    gap: 10px; margin-bottom: 20px;
  }
  .metric {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--radius); padding: 14px;
  }
  .metric-label {
    font-size: 12px; color: var(--text-dim);
    text-transform: uppercase; letter-spacing: 0.04em;
    margin: 0 0 6px;
  }
  .metric-value {
    font-size: 26px; font-weight: 600; line-height: 1.1;
    font-variant-numeric: tabular-nums;
  }
  .metric-unit { font-size: 13px; color: var(--text-dim); font-weight: 400; margin-left: 4px; }
  .metric.wide { grid-column: span 2; }
  details {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--radius); padding: 12px 14px; margin-bottom: 12px;
  }
  summary {
    cursor: pointer; font-size: 14px; color: var(--text-dim); font-weight: 500;
    list-style: none; display: flex; justify-content: space-between; align-items: center;
  }
  summary::-webkit-details-marker { display: none; }
  summary::after { content: "▾"; color: var(--text-muted); transition: transform 0.2s; }
  details[open] summary::after { transform: rotate(180deg); }
  .log {
    margin: 10px 0 0;
    font-family: ui-monospace, "SF Mono", Menlo, monospace;
    font-size: 11px; line-height: 1.6;
    max-height: 240px; overflow-y: auto;
    background: var(--bg); border-radius: 8px; padding: 10px;
    color: var(--text-dim); white-space: pre-wrap; word-break: break-all;
  }
  .log .info { color: var(--text); }
  .log .ok { color: var(--success); }
  .log .err { color: var(--danger); }
  .log .warn { color: var(--warning); }
  .log .hex { color: #c084fc; }
  .footer { text-align: center; font-size: 11px; color: var(--text-muted); padding: 20px 0 10px; }
</style>
</head>
<body>
<div class="app">

  <header>
    <div>
      <h1 class="title">Rameur Woodrover</h1>
      <p class="subtitle" id="status">Initialisation...</p>
    </div>
    <div class="status-dot" id="dot"></div>
  </header>

  <div class="btn-row">
    <button class="primary" id="btn-connect">Se connecter</button>
    <button id="btn-disconnect" disabled>Déconnecter</button>
  </div>

  <div class="metrics-grid">
    <div class="metric"><p class="metric-label">Cadence</p><p class="metric-value"><span id="m-spm">—</span><span class="metric-unit">spm</span></p></div>
    <div class="metric"><p class="metric-label">Puissance</p><p class="metric-value"><span id="m-pwr">—</span><span class="metric-unit">W</span></p></div>
    <div class="metric"><p class="metric-label">Allure /500m</p><p class="metric-value" id="m-pace">—</p></div>
    <div class="metric"><p class="metric-label">Vitesse</p><p class="metric-value"><span id="m-speed">—</span><span class="metric-unit">km/h</span></p></div>
    <div class="metric"><p class="metric-label">Distance</p><p class="metric-value"><span id="m-dist">—</span><span class="metric-unit">m</span></p></div>
    <div class="metric"><p class="metric-label">Temps</p><p class="metric-value" id="m-time">—</p></div>
    <div class="metric"><p class="metric-label">Calories</p><p class="metric-value"><span id="m-cal">—</span><span class="metric-unit">kcal</span></p></div>
    <div class="metric"><p class="metric-label">Coups totaux</p><p class="metric-value" id="m-strokes">—</p></div>
    <div class="metric wide"><p class="metric-label">Fréquence cardiaque</p><p class="metric-value"><span id="m-hr">—</span><span class="metric-unit">bpm</span></p></div>
  </div>

  <details open>
    <summary>Console diagnostic BLE</summary>
    <div class="log" id="log">Chargement...</div>
  </details>

  <div class="footer">Rameur App · v0.1.2</div>
</div>

<script>
// ============================================================
// Tout est encapsulé dans une IIFE qui démarre au DOMContentLoaded
// pour garantir que tous les éléments existent au moment de l'init.
// ============================================================
(function() {
  'use strict';

  // Capture globale d'erreurs pour ne JAMAIS planter silencieusement
  window.addEventListener('error', function(ev) {
    try {
      const logEl = document.getElementById('log');
      if (logEl) {
        const line = document.createElement('div');
        line.style.color = '#f87171';
        line.textContent = '⚠ JS Error: ' + ev.message + ' @ ' + (ev.filename || '?') + ':' + ev.lineno;
        logEl.appendChild(line);
      }
    } catch(e) {}
  });
  window.addEventListener('unhandledrejection', function(ev) {
    try {
      const logEl = document.getElementById('log');
      if (logEl) {
        const line = document.createElement('div');
        line.style.color = '#f87171';
        line.textContent = '⚠ Unhandled rejection: ' + (ev.reason && ev.reason.message ? ev.reason.message : String(ev.reason));
        logEl.appendChild(line);
      }
    } catch(e) {}
  });

  function init() {
    // UUIDs au format STRING (Bluefy refuse les numbers)
    const UUID = {
      FTMS_SERVICE:            '00001826-0000-1000-8000-00805f9b34fb',
      ROWER_DATA:              '00002ad1-0000-1000-8000-00805f9b34fb',
      FITNESS_MACHINE_FEATURE: '00002acc-0000-1000-8000-00805f9b34fb',
      CONTROL_POINT:           '00002ad9-0000-1000-8000-00805f9b34fb',
      HRS_SERVICE:             '0000180d-0000-1000-8000-00805f9b34fb',
      HRM_CHARACTERISTIC:      '00002a37-0000-1000-8000-00805f9b34fb',
      DEVICE_INFO:             '0000180a-0000-1000-8000-00805f9b34fb',
    };

    const state = {
      device: null, server: null, characteristics: {},
      connected: false, lastData: {},
    };

    // Récupération sécurisée des éléments avec vérification
    const ids = ['status','dot','btn-connect','btn-disconnect','log',
                 'm-spm','m-pwr','m-pace','m-speed','m-dist','m-time',
                 'm-cal','m-strokes','m-hr'];
    const els = {};
    const missing = [];
    for (let i = 0; i < ids.length; i++) {
      const el = document.getElementById(ids[i]);
      if (!el) missing.push(ids[i]);
      els[ids[i]] = el;
    }
    if (missing.length > 0) {
      alert('Erreur init : éléments manquants : ' + missing.join(', '));
      return;
    }

    function log(msg, type) {
      type = type || 'info';
      const ts = new Date().toLocaleTimeString('fr-FR', { hour12: false });
      const line = document.createElement('div');
      line.className = type;
      line.textContent = '[' + ts + '] ' + msg;
      els['log'].appendChild(line);
      els['log'].scrollTop = els['log'].scrollHeight;
      while (els['log'].childElementCount > 200) els['log'].removeChild(els['log'].firstChild);
    }

    function setStatus(text, dotClass) {
      els['status'].textContent = text;
      els['dot'].className = 'status-dot' + (dotClass ? ' ' + dotClass : '');
    }

    function setConnectedUI(connected) {
      state.connected = connected;
      els['btn-connect'].disabled = connected;
      els['btn-disconnect'].disabled = !connected;
    }

    function resetMetrics() {
      ['m-spm','m-pwr','m-speed','m-dist','m-cal','m-strokes','m-hr'].forEach(function(k){
        els[k].textContent = '—';
      });
      els['m-pace'].textContent = '—';
      els['m-time'].textContent = '—';
    }

    function fmtTime(seconds) {
      if (!Number.isFinite(seconds)) return '—';
      const h = Math.floor(seconds / 3600);
      const m = Math.floor((seconds % 3600) / 60);
      const s = Math.floor(seconds % 60);
      if (h > 0) return h + ':' + String(m).padStart(2,'0') + ':' + String(s).padStart(2,'0');
      return m + ':' + String(s).padStart(2,'0');
    }

    function bytesToHex(dv) {
      const arr = [];
      for (let i = 0; i < dv.byteLength; i++) {
        arr.push(dv.getUint8(i).toString(16).padStart(2, '0'));
      }
      return arr.join(' ');
    }

    function describeError(e) {
      if (e === undefined) return 'undefined';
      if (e === null) return 'null';
      if (typeof e === 'string') return e;
      const parts = [];
      if (e.name) parts.push(e.name);
      if (e.message) parts.push(e.message);
      if (!parts.length) { try { parts.push(String(e)); } catch(_){} }
      return parts.join(' — ') || 'erreur inconnue';
    }

    function parseRowerData(dv) {
      const flags = dv.getUint16(0, true);
      let offset = 2;
      const data = {};
      const moreData = (flags & 0x0001) !== 0;
      if (!moreData) {
        if (offset + 1 <= dv.byteLength) { data.strokeRate = dv.getUint8(offset) * 0.5; offset += 1; }
        if (offset + 2 <= dv.byteLength) { data.strokeCount = dv.getUint16(offset, true); offset += 2; }
      }
      if ((flags & 0x0002) && offset + 1 <= dv.byteLength) { data.avgStrokeRate = dv.getUint8(offset) * 0.5; offset += 1; }
      if ((flags & 0x0004) && offset + 3 <= dv.byteLength) {
        data.totalDistance = dv.getUint8(offset) | (dv.getUint8(offset+1) << 8) | (dv.getUint8(offset+2) << 16);
        offset += 3;
      }
      if ((flags & 0x0008) && offset + 2 <= dv.byteLength) { data.instantPace = dv.getUint16(offset, true); offset += 2; }
      if ((flags & 0x0010) && offset + 2 <= dv.byteLength) { data.avgPace = dv.getUint16(offset, true); offset += 2; }
      if ((flags & 0x0020) && offset + 2 <= dv.byteLength) { data.instantPower = dv.getInt16(offset, true); offset += 2; }
      if ((flags & 0x0040) && offset + 2 <= dv.byteLength) { data.avgPower = dv.getInt16(offset, true); offset += 2; }
      if ((flags & 0x0080) && offset + 2 <= dv.byteLength) { data.resistance = dv.getInt16(offset, true); offset += 2; }
      if ((flags & 0x0100)) {
        if (offset + 2 <= dv.byteLength) { data.totalEnergy = dv.getUint16(offset, true); offset += 2; }
        if (offset + 2 <= dv.byteLength) { data.energyPerHour = dv.getUint16(offset, true); offset += 2; }
        if (offset + 1 <= dv.byteLength) { data.energyPerMinute = dv.getUint8(offset); offset += 1; }
      }
      if ((flags & 0x0200) && offset + 1 <= dv.byteLength) { data.heartRate = dv.getUint8(offset); offset += 1; }
      if ((flags & 0x0400) && offset + 1 <= dv.byteLength) { data.metabolicEquivalent = dv.getUint8(offset) * 0.1; offset += 1; }
      if ((flags & 0x0800) && offset + 2 <= dv.byteLength) { data.elapsedTime = dv.getUint16(offset, true); offset += 2; }
      if ((flags & 0x1000) && offset + 2 <= dv.byteLength) { data.remainingTime = dv.getUint16(offset, true); offset += 2; }
      return data;
    }

    function updateMetrics(d) {
      Object.assign(state.lastData, d);
      const s = state.lastData;
      if (s.strokeRate !== undefined) els['m-spm'].textContent = Math.round(s.strokeRate);
      if (s.strokeCount !== undefined) els['m-strokes'].textContent = s.strokeCount;
      if (s.instantPower !== undefined) els['m-pwr'].textContent = s.instantPower;
      if (s.totalDistance !== undefined) els['m-dist'].textContent = s.totalDistance;
      if (s.totalEnergy !== undefined) els['m-cal'].textContent = s.totalEnergy;
      if (s.heartRate !== undefined) els['m-hr'].textContent = s.heartRate;
      if (s.elapsedTime !== undefined) els['m-time'].textContent = fmtTime(s.elapsedTime);
      if (s.instantPace !== undefined && s.instantPace > 0) {
        const m = Math.floor(s.instantPace / 60);
        const sec = Math.floor(s.instantPace % 60);
        els['m-pace'].textContent = m + ':' + String(sec).padStart(2,'0');
        const kmh = (500 / s.instantPace) * 3.6;
        els['m-speed'].textContent = kmh.toFixed(1);
      }
    }

    function handleRowerNotification(event) {
      const dv = event.target.value;
      try {
        const data = parseRowerData(dv);
        updateMetrics(data);
        const keys = Object.keys(data);
        if (keys.length > 0) {
          const parts = keys.map(function(k){ return k + '=' + data[k]; });
          log('📊 ' + parts.join(', '), 'info');
        }
      } catch (e) {
        log('Parse error: ' + describeError(e) + ' | raw: ' + bytesToHex(dv), 'err');
      }
    }

    function handleHrNotification(event) {
      const dv = event.target.value;
      const flags = dv.getUint8(0);
      const is16 = (flags & 0x01) !== 0;
      const hr = is16 ? dv.getUint16(1, true) : dv.getUint8(1);
      state.lastData.heartRate = hr;
      els['m-hr'].textContent = hr;
    }

    async function connect() {
      log('▶ Tap "Se connecter" détecté.', 'info');
      if (!navigator.bluetooth) {
        log('navigator.bluetooth indisponible. Utilise Bluefy.', 'err');
        return;
      }
      try {
        setStatus('Recherche du rameur...', 'connecting');
        log('Ouverture du sélecteur (filtre FTMS)...', 'info');

        state.device = await navigator.bluetooth.requestDevice({
          filters: [{ services: [UUID.FTMS_SERVICE] }],
          optionalServices: [UUID.FTMS_SERVICE, UUID.HRS_SERVICE, UUID.DEVICE_INFO],
        });

        log('Sélectionné : ' + (state.device.name || '(sans nom)'), 'ok');
        state.device.addEventListener('gattserverdisconnected', onDisconnected);

        setStatus('Connexion GATT...', 'connecting');
        state.server = await state.device.gatt.connect();
        log('GATT server connecté.', 'ok');

        setStatus('Découverte des services...', 'connecting');
        const services = await state.server.getPrimaryServices();
        log(services.length + ' service(s) détecté(s).', 'ok');
        for (let i = 0; i < services.length; i++) {
          log('  └─ ' + services[i].uuid, 'info');
        }

        try {
          const ftms = await state.server.getPrimaryService(UUID.FTMS_SERVICE);
          log('✓ Service FTMS trouvé.', 'ok');
          await setupFTMS(ftms);
        } catch (e) {
          log('FTMS setup : ' + describeError(e), 'err');
        }

        try {
          const hrs = await state.server.getPrimaryService(UUID.HRS_SERVICE);
          const hrm = await hrs.getCharacteristic(UUID.HRM_CHARACTERISTIC);
          await hrm.startNotifications();
          hrm.addEventListener('characteristicvaluechanged', handleHrNotification);
          log('✓ Heart Rate activé.', 'ok');
        } catch (e) {
          log('HR non dispo (normal sans ceinture).', 'info');
        }

        setStatus('Connecté à ' + (state.device.name || 'rameur'), 'connected');
        setConnectedUI(true);

      } catch (e) {
        log('Erreur connexion : ' + describeError(e), 'err');
        setStatus('Échec de connexion', '');
        setConnectedUI(false);
      }
    }

    async function setupFTMS(ftms) {
      const chars = await ftms.getCharacteristics();
      log('FTMS : ' + chars.length + ' caractéristique(s)', 'info');
      for (let i = 0; i < chars.length; i++) {
        const c = chars[i];
        const props = [];
        if (c.properties.read) props.push('read');
        if (c.properties.notify) props.push('notify');
        if (c.properties.write) props.push('write');
        if (c.properties.writeWithoutResponse) props.push('writeNR');
        if (c.properties.indicate) props.push('indicate');
        log('  └─ ' + c.uuid + ' [' + props.join(',') + ']', 'info');
      }

      try {
        const rowerData = await ftms.getCharacteristic(UUID.ROWER_DATA);
        await rowerData.startNotifications();
        rowerData.addEventListener('characteristicvaluechanged', handleRowerNotification);
        state.characteristics.rowerData = rowerData;
        log('✓ Rower Data notifications ON.', 'ok');
      } catch (e) {
        log('Rower Data : ' + describeError(e), 'err');
      }

      try {
        const feat = await ftms.getCharacteristic(UUID.FITNESS_MACHINE_FEATURE);
        const val = await feat.readValue();
        log('Features hex : ' + bytesToHex(val), 'hex');
      } catch (e) {
        log('Features : ' + describeError(e), 'warn');
      }

      try {
        const cp = await ftms.getCharacteristic(UUID.CONTROL_POINT);
        state.characteristics.controlPoint = cp;
        log('✓ Control Point disponible.', 'ok');
      } catch (e) {
        log('Control Point indispo.', 'warn');
      }
    }

    function onDisconnected() {
      log('Déconnexion GATT.', 'warn');
      setStatus('Déconnecté', '');
      setConnectedUI(false);
      state.server = null;
      state.characteristics = {};
    }

    async function disconnect() {
      if (state.device && state.device.gatt.connected) {
        state.device.gatt.disconnect();
      }
      setConnectedUI(false);
      setStatus('Non connecté', '');
      resetMetrics();
      log('Déconnexion manuelle.', 'info');
    }

    // Init UI
    els['log'].textContent = '';
    log('App initialisée. v0.1.2', 'info');

    if (!navigator.bluetooth) {
      log('⚠ navigator.bluetooth indisponible. Ouvre cette page dans Bluefy.', 'err');
      els['btn-connect'].disabled = true;
      setStatus('Bluefy requis', '');
    } else {
      log('✓ Web Bluetooth disponible. Prêt à connecter.', 'ok');
      setStatus('Non connecté', '');
    }

    els['btn-connect'].addEventListener('click', connect);
    els['btn-disconnect'].addEventListener('click', disconnect);
    log('✓ Boutons activés.', 'ok');
  }

  // Démarre uniquement quand le DOM est totalement prêt
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', init);
  } else {
    init();
  }
})();
</script>
</body>
</html>
