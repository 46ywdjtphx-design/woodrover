<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>Lecteur · Rameur Woodrover</title>
<link rel="stylesheet" href="style.css">
<style>
  body { padding: 0; }

  /* ====================================================
     VUE LISTE (avant entraînement)
     ==================================================== */
  .list-view {
    max-width: 600px;
    margin: 0 auto;
    padding: max(env(safe-area-inset-top), 16px) 16px env(safe-area-inset-bottom, 16px);
  }
  .list-header {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 16px;
  }
  .list-header h1 {
    margin: 0; font-size: 20px;
    display: flex; align-items: center; gap: 6px;
  }
  .list-header h1 a { color: var(--text-dim); text-decoration: none; }
  .ble-status {
    display: flex; align-items: center; gap: 8px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 12px 16px;
    margin-bottom: 16px;
    box-shadow: var(--shadow);
  }
  .ble-dot {
    width: 10px; height: 10px; border-radius: 50%;
    background: var(--danger);
  }
  .ble-dot.connecting { background: var(--warning); animation: pulse 1.2s infinite; }
  .ble-dot.connected { background: var(--success); }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.4} }
  .ble-status .ble-label { flex: 1; font-size: 13px; color: var(--text-dim); }
  .ble-status button { padding: 8px 12px; font-size: 13px; }

  .workout-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 14px 16px;
    margin-bottom: 10px;
    display: flex; align-items: center; justify-content: space-between;
    gap: 12px;
    box-shadow: var(--shadow);
  }
  .workout-card .info { flex: 1; min-width: 0; }
  .workout-card .name { font-size: 15px; font-weight: 500; margin-bottom: 2px; }
  .workout-card .meta { font-size: 12px; color: var(--text-dim); }
  .workout-card button { padding: 10px 16px; }

  .empty-state {
    text-align: center;
    padding: 60px 20px;
    color: var(--text-dim);
  }
  .empty-state .big { font-size: 48px; margin-bottom: 12px; }
  .empty-state p { margin: 8px 0; font-size: 14px; }

  .import-row { display: flex; gap: 8px; margin: 16px 0; }
  .import-row button { flex: 1; font-size: 13px; }

  /* ====================================================
     VUE LECTEUR (entraînement en cours)
     ==================================================== */
  .player-view {
    position: fixed;
    inset: 0;
    background: var(--bg);
    display: none;
    flex-direction: column;
    padding-top: env(safe-area-inset-top);
    padding-bottom: env(safe-area-inset-bottom);
    padding-left: env(safe-area-inset-left);
    padding-right: env(safe-area-inset-right);
  }
  .player-view.active { display: flex; }

  /* === Bandeau haut (fin) === */
  .player-top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 8px 16px;
    flex-shrink: 0;
    background: var(--surface);
    border-bottom: 1px solid var(--border-soft);
    gap: 12px;
  }
  .player-top button.ghost {
    padding: 6px 10px;
    font-size: 13px;
  }
  .player-top .block-label {
    font-size: 13px;
    color: var(--text-dim);
    flex: 1;
    text-align: center;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .player-top .block-label strong { color: var(--text); }
  .player-top .global-time {
    font-size: 15px;
    color: var(--text);
    display: flex; align-items: baseline; gap: 4px;
  }
  .player-top .global-time .total {
    color: var(--text-dim);
    font-size: 12px;
  }

  /* === Timeline (élément central) === */
  .timeline-wrap {
    flex: 1 1 auto;
    padding: 16px 16px 8px;
    min-height: 0;
    display: flex;
    flex-direction: column;
  }
  .timeline {
    position: relative;
    flex: 1;
    background: var(--surface);
    border-radius: var(--radius);
    border: 1px solid var(--border);
    overflow: hidden;
    display: flex;
    align-items: flex-end;
    box-shadow: var(--shadow);
  }
  .timeline-bar {
    position: relative;
    color: white;
    font-size: 14px;
    font-weight: 700;
    display: flex;
    align-items: flex-start;
    justify-content: center;
    padding-top: 8px;
    transition: opacity 0.3s, filter 0.3s, height 0.25s ease, background 0.25s ease;
    margin-right: 1px;
    text-shadow: 0 1px 2px rgba(0,0,0,0.25);
  }
  .timeline-bar.past { opacity: 0.35; }
  .timeline-bar.current { filter: brightness(1.1) saturate(1.2); }
  .timeline-bar.overridden {
    outline: 2px dashed var(--warning);
    outline-offset: -3px;
  }
  .timeline-cursor {
    position: absolute;
    top: 0; bottom: 0;
    width: 3px;
    background: var(--warning);
    box-shadow: 0 0 8px var(--warning), 0 0 0 1px white;
    transition: left 0.3s linear;
    pointer-events: none;
    z-index: 2;
  }
  .timeline-cursor::before {
    content: '';
    position: absolute;
    top: 0; left: 50%;
    width: 14px; height: 14px;
    transform: translate(-50%, -50%);
    background: var(--warning);
    border-radius: 50%;
    border: 2px solid white;
    box-shadow: 0 0 6px rgba(0,0,0,0.25);
  }
  .timeline-time-labels {
    display: flex;
    justify-content: space-between;
    font-size: 11px;
    color: var(--text-dim);
    padding: 4px 4px 0;
  }

  /* === Barre de contrôles (Play, Pause, Stop + override) === */
  .player-controls {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 8px 16px;
    flex-shrink: 0;
    background: var(--surface);
    border-top: 1px solid var(--border-soft);
    border-bottom: 1px solid var(--border-soft);
    gap: 16px;
  }
  .transport {
    display: flex;
    gap: 8px;
  }
  .transport button {
    width: 56px; height: 44px;
    padding: 0;
    font-size: 18px;
    font-weight: 600;
  }
  .transport .play.active { background: var(--success); border-color: var(--success); color: white; }
  .transport .pause.active { background: var(--warning); border-color: var(--warning); color: white; }
  .resistance-block {
    display: flex; align-items: center; gap: 10px;
  }
  .resistance-block .res-lbl {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: var(--text-dim);
    margin-right: 4px;
  }
  .resistance-block button.res-btn {
    width: 44px; height: 44px;
    padding: 0;
    font-size: 22px;
    font-weight: 600;
    border-radius: 50%;
  }
  .resistance-block .res-value {
    font-size: 32px;
    font-weight: 700;
    color: var(--accent);
    min-width: 1.4em;
    text-align: center;
    line-height: 1;
  }
  .resistance-block .res-value.override { color: var(--warning); }
  .resistance-block .override-tag {
    font-size: 9px;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: var(--warning);
    margin-top: 2px;
    height: 12px;
  }

  /* === Métriques bas avec "temps restant bloc" en gros === */
  .player-bottom {
    display: grid;
    grid-template-columns: 1.6fr repeat(4, 1fr);
    gap: 8px;
    padding: 10px 16px 12px;
    flex-shrink: 0;
  }
  .metric-cell {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    padding: 8px 10px;
    text-align: center;
    box-shadow: var(--shadow);
  }
  .metric-cell .m-lbl {
    font-size: 10px;
    color: var(--text-dim);
    text-transform: uppercase;
    letter-spacing: 0.06em;
  }
  .metric-cell .m-val {
    font-size: 22px;
    font-weight: 600;
    font-variant-numeric: tabular-nums;
    line-height: 1.2;
  }
  .metric-cell .m-unit {
    font-size: 11px;
    color: var(--text-dim);
    font-weight: 400;
    margin-left: 2px;
  }
  .metric-cell.big {
    background: var(--accent-dim);
    border-color: var(--accent);
  }
  .metric-cell.big .m-lbl { color: var(--accent); font-weight: 600; }
  .metric-cell.big .m-val {
    font-size: 42px;
    color: var(--accent);
    font-weight: 700;
    letter-spacing: -1px;
  }

  /* Overlay de fin */
  .overlay-finished {
    position: absolute;
    inset: 0;
    background: rgba(245, 246, 248, 0.95);
    display: flex;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    z-index: 100;
    padding: 20px;
    text-align: center;
    backdrop-filter: blur(4px);
  }
  .overlay-finished.hidden { display: none; }
  .overlay-finished h2 { margin: 0 0 12px; font-size: 26px; color: var(--success); }
  .overlay-finished p { margin: 4px 0; color: var(--text-dim); font-size: 14px; }
  .overlay-finished .actions { margin-top: 24px; display: flex; gap: 10px; }

  /* Suggestion paysage en mode portrait */
  .landscape-suggest {
    position: fixed;
    inset: 0;
    background: var(--bg);
    z-index: 200;
    display: none;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    padding: 40px 20px;
    text-align: center;
  }
  .landscape-suggest.show { display: flex; }
  .landscape-suggest .big-emoji { font-size: 64px; margin-bottom: 20px; }
  .landscape-suggest p { color: var(--text-dim); font-size: 14px; }
  .landscape-suggest button { margin-top: 20px; }

  /* Layout portrait : empile pour rester utilisable */
  @media (orientation: portrait) {
    .player-bottom {
      grid-template-columns: 1fr 1fr;
    }
    .metric-cell.big { grid-column: 1 / -1; }
    .player-top .block-label { font-size: 12px; }
  }

  /* Console BLE collapsible (uniquement en vue liste) */
  details.ble-console {
    margin-top: 24px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 12px 14px;
    box-shadow: var(--shadow);
  }
  details.ble-console summary {
    cursor: pointer;
    font-size: 13px;
    color: var(--text-dim);
  }
  #ble-log {
    font-family: var(--font-digital);
    font-size: 11px;
    line-height: 1.6;
    max-height: 200px;
    overflow-y: auto;
    background: var(--surface-2);
    border-radius: 8px;
    padding: 10px;
    color: var(--text-dim);
    margin-top: 8px;
    white-space: pre-wrap;
    word-break: break-all;
  }
</style>
</head>
<body>

<!-- ====== VUE LISTE ====== -->
<div class="list-view" id="list-view">
  <div class="list-header">
    <h1><a href="index.html">←</a> Lecteur</h1>
  </div>

  <div class="ble-status">
    <div class="ble-dot" id="ble-dot"></div>
    <div class="ble-label" id="ble-label">Bluetooth non connecté</div>
    <button class="primary" id="btn-connect">Connecter</button>
    <button id="btn-disconnect" style="display:none">Déconnecter</button>
  </div>

  <h2 style="font-size:15px; margin:20px 0 10px; color:var(--text-dim);">Entraînements</h2>
  <div id="workout-list"></div>

  <div class="import-row">
    <button id="btn-import">📥 Importer</button>
    <button id="btn-export">📤 Exporter</button>
  </div>
  <input type="file" id="import-file" accept=".json,application/json" style="display:none">

  <details class="ble-console">
    <summary>Console diagnostic BLE</summary>
    <div id="ble-log">En attente...</div>
  </details>
</div>

<!-- ====== VUE LECTEUR ====== -->
<div class="player-view" id="player-view">

  <div class="player-top">
    <button class="ghost" id="btn-quit">← Quitter</button>
    <div class="block-label" id="block-label">—</div>
    <div class="global-time">
      <span class="digital" id="t-elapsed">0:00</span>
      <span class="total">/ <span class="digital" id="t-total">0:00</span></span>
    </div>
  </div>

  <div class="timeline-wrap">
    <div class="timeline" id="timeline">
      <div class="timeline-cursor" id="timeline-cursor"></div>
    </div>
    <div class="timeline-time-labels">
      <span class="digital">0:00</span>
      <span class="digital" id="t-total-bottom">0:00</span>
    </div>
  </div>

  <div class="player-controls">
    <div class="transport">
      <button id="btn-play" class="success play" title="Lancer">▶</button>
      <button id="btn-pause" class="pause" title="Pause" disabled>⏸</button>
      <button id="btn-stop" class="danger" title="Stop" disabled>⏹</button>
    </div>
    <div class="resistance-block">
      <span class="res-lbl">Résistance</span>
      <button class="res-btn" id="btn-res-minus">−</button>
      <div style="display:flex;flex-direction:column;align-items:center;">
        <span class="res-value digital" id="res-value">5</span>
        <span class="override-tag" id="res-override-tag"></span>
      </div>
      <button class="res-btn" id="btn-res-plus">+</button>
    </div>
  </div>

  <div class="player-bottom">
    <div class="metric-cell big">
      <div class="m-lbl">Temps restant bloc</div>
      <div class="m-val digital" id="block-remaining">0:00</div>
    </div>
    <div class="metric-cell">
      <div class="m-lbl">Puissance</div>
      <div class="m-val digital"><span id="m-power">—</span><span class="m-unit">W</span></div>
    </div>
    <div class="metric-cell">
      <div class="m-lbl">Cadence</div>
      <div class="m-val digital"><span id="m-spm">—</span><span class="m-unit">spm</span></div>
    </div>
    <div class="metric-cell">
      <div class="m-lbl">Allure /500m</div>
      <div class="m-val digital" id="m-pace">—</div>
    </div>
    <div class="metric-cell">
      <div class="m-lbl">Distance</div>
      <div class="m-val digital"><span id="m-dist">—</span><span class="m-unit">m</span></div>
    </div>
  </div>

  <div class="overlay-finished hidden" id="overlay-finished">
    <h2>✓ Entraînement terminé</h2>
    <p id="finished-summary">—</p>
    <div class="actions">
      <button class="primary" id="btn-finished-back">Retour</button>
    </div>
  </div>
</div>

<!-- Suggestion paysage -->
<div class="landscape-suggest" id="landscape-suggest">
  <div class="big-emoji">📱↻</div>
  <p>Tourne ton iPhone en mode paysage<br>pour une meilleure expérience.</p>
  <button id="btn-ignore-landscape">Continuer en portrait</button>
</div>

<script src="app.js"></script>
<script>
(function() {
  'use strict';
  const { Storage, Blocks, Utils, Toast, BLE, RowerDriver } = RameurApp;

  // ============================================================
  // ÉTAT
  // ============================================================
  const state = {
    driver: new RowerDriver(),
    bleConnected: false,
    // Session active
    workout: null,
    running: false,           // session active (jouant ou en pause)
    paused: false,            // si running && paused : timer figé
    sessionStartMs: 0,
    pausedAccumMs: 0,
    pauseStartMs: 0,
    elapsedMs: 0,
    currentBlockIdx: -1,
    overrideLevel: null,
    lastStrokeCount: 0,
    landscapeIgnored: false,
  };

  let sessionTimer = null;

  // ============================================================
  // BLE LOG
  // ============================================================
  const bleLogEl = document.getElementById('ble-log');
  state.driver.on('log', function(entry) {
    if (!bleLogEl) return;
    const time = new Date(entry.ts).toLocaleTimeString('fr-FR', { hour12: false });
    const line = document.createElement('div');
    line.textContent = '[' + time + '] ' + entry.msg;
    if (entry.type === 'err') line.style.color = 'var(--danger)';
    else if (entry.type === 'warn') line.style.color = 'var(--warning)';
    else if (entry.type === 'ok') line.style.color = 'var(--success)';
    else if (entry.type === 'cp') line.style.color = 'var(--purple)';
    bleLogEl.appendChild(line);
    bleLogEl.scrollTop = bleLogEl.scrollHeight;
    while (bleLogEl.childElementCount > 100) bleLogEl.removeChild(bleLogEl.firstChild);
  });

  state.driver.on('status', function(s) {
    const dot = document.getElementById('ble-dot');
    const label = document.getElementById('ble-label');
    const btnC = document.getElementById('btn-connect');
    const btnD = document.getElementById('btn-disconnect');
    dot.classList.remove('connecting', 'connected');
    if (s === 'connecting') {
      dot.classList.add('connecting');
      label.textContent = 'Connexion en cours...';
      btnC.style.display = 'none';
      btnD.style.display = 'none';
    } else if (s === 'connected') {
      dot.classList.add('connected');
      label.textContent = 'Connecté à ' + (state.driver.device ? (state.driver.device.name || 'rameur') : 'rameur');
      state.bleConnected = true;
      btnC.style.display = 'none';
      btnD.style.display = 'inline-flex';
    } else {
      label.textContent = 'Bluetooth non connecté';
      state.bleConnected = false;
      btnC.style.display = 'inline-flex';
      btnD.style.display = 'none';
    }
  });

  // ============================================================
  // BLE DATA → mise à jour métriques + auto-start
  // ============================================================
  state.driver.on('data', function(d) {
    if (d.instantPower !== undefined) document.getElementById('m-power').textContent = d.instantPower;
    if (d.strokeRate !== undefined) document.getElementById('m-spm').textContent = Math.round(d.strokeRate);
    if (d.totalDistance !== undefined) document.getElementById('m-dist').textContent = d.totalDistance;
    if (d.instantPace !== undefined) {
      if (d.instantPace > 0) {
        const m = Math.floor(d.instantPace / 60);
        const s = Math.floor(d.instantPace % 60);
        document.getElementById('m-pace').textContent = m + ':' + String(s).padStart(2,'0');
      } else {
        document.getElementById('m-pace').textContent = '—';
      }
    }

    // Auto-start au 1er coup de rame
    const isActive = (d.strokeRate || 0) > 0 || (d.strokeCount || 0) > state.lastStrokeCount;
    if (isActive && state.workout && !state.running) {
      state.lastStrokeCount = d.strokeCount || 0;
      startSession();
    }
    if (d.strokeCount !== undefined) state.lastStrokeCount = d.strokeCount;
  });

  // ============================================================
  // VUE LISTE
  // ============================================================
  function renderList() {
    const list = document.getElementById('workout-list');
    const workouts = Storage.getAll();
    if (workouts.length === 0) {
      list.innerHTML =
        '<div class="empty-state">' +
          '<div class="big">📋</div>' +
          '<p>Aucun entraînement.</p>' +
          '<p style="font-size:13px;">Crée-en avec l\'éditeur (sur ordinateur) ou importe un fichier JSON.</p>' +
        '</div>';
      return;
    }
    workouts.sort(function(a,b){ return (b.updatedAt||0) - (a.updatedAt||0); });
    list.innerHTML = '';
    workouts.forEach(function(w) {
      const total = Blocks.totalDuration(w);
      const card = document.createElement('div');
      card.className = 'workout-card';
      card.innerHTML =
        '<div class="info">' +
          '<div class="name"></div>' +
          '<div class="meta">' + w.blocks.length + ' blocs · ' + Utils.fmtTime(total) + '</div>' +
        '</div>' +
        '<button class="primary">▶ Lancer</button>';
      card.querySelector('.name').textContent = w.name;
      card.querySelector('button').addEventListener('click', function() {
        launchWorkout(w);
      });
      list.appendChild(card);
    });
  }

  // ============================================================
  // LANCEMENT WORKOUT (entrée dans la vue lecteur)
  // ============================================================
  function launchWorkout(workout) {
    if (workout.blocks.length === 0) {
      Toast.error('Cet entraînement n\'a pas de blocs');
      return;
    }
    if (!state.bleConnected) {
      const proceed = confirm('Bluetooth non connecté. Lancer quand même en mode visualisation seule ?');
      if (!proceed) return;
    }
    state.workout = workout;
    state.running = false;
    state.paused = false;
    state.pausedAccumMs = 0;
    state.elapsedMs = 0;
    state.currentBlockIdx = -1;
    state.overrideLevel = null;
    state.lastStrokeCount = 0;

    document.getElementById('list-view').style.display = 'none';
    const pv = document.getElementById('player-view');
    pv.classList.add('active');

    document.getElementById('overlay-finished').classList.add('hidden');

    const totalSec = Blocks.totalDuration(workout);
    document.getElementById('t-total').textContent = Utils.fmtTime(totalSec);
    document.getElementById('t-total-bottom').textContent = Utils.fmtTime(totalSec);

    setTransportState('idle');
    renderTimeline();
    updatePlayerUI();
    checkLandscape();

    // Pré-règle la résistance au niveau du 1er bloc
    if (state.bleConnected && workout.blocks[0]) {
      state.driver.setResistanceLevel(workout.blocks[0].level).catch(function(){});
    }
  }

  function checkLandscape() {
    if (state.landscapeIgnored) {
      document.getElementById('landscape-suggest').classList.remove('show');
      return;
    }
    const isPortrait = window.innerHeight > window.innerWidth;
    const playerActive = document.getElementById('player-view').classList.contains('active');
    const suggest = document.getElementById('landscape-suggest');
    if (isPortrait && playerActive && Utils.isMobile()) {
      suggest.classList.add('show');
    } else {
      suggest.classList.remove('show');
    }
  }

  document.getElementById('btn-ignore-landscape').addEventListener('click', function() {
    state.landscapeIgnored = true;
    document.getElementById('landscape-suggest').classList.remove('show');
  });
  window.addEventListener('resize', checkLandscape);
  window.addEventListener('orientationchange', checkLandscape);

  // ============================================================
  // TRANSPORT : états Play / Pause / Stop
  // ============================================================
  /**
   * Trois états :
   * - 'idle'    : pas encore lancé. Play=actif, Pause/Stop=disabled
   * - 'playing' : en cours. Play=highlight, Pause=actif, Stop=actif
   * - 'paused'  : en pause. Play=actif (= reprendre), Pause=highlight, Stop=actif
   */
  function setTransportState(s) {
    const playBtn = document.getElementById('btn-play');
    const pauseBtn = document.getElementById('btn-pause');
    const stopBtn = document.getElementById('btn-stop');
    playBtn.classList.remove('active');
    pauseBtn.classList.remove('active');
    if (s === 'idle') {
      playBtn.disabled = false;
      pauseBtn.disabled = true;
      stopBtn.disabled = true;
    } else if (s === 'playing') {
      playBtn.classList.add('active');
      playBtn.disabled = true;
      pauseBtn.disabled = false;
      stopBtn.disabled = false;
    } else if (s === 'paused') {
      pauseBtn.classList.add('active');
      playBtn.disabled = false;
      pauseBtn.disabled = true;
      stopBtn.disabled = false;
    }
  }

  function startSession() {
    if (state.running) {
      // Si en pause, reprendre
      if (state.paused) {
        state.paused = false;
        if (state.pauseStartMs) {
          state.pausedAccumMs += (Date.now() - state.pauseStartMs);
          state.pauseStartMs = 0;
        }
        setTransportState('playing');
      }
      return;
    }
    state.running = true;
    state.paused = false;
    state.sessionStartMs = Date.now();
    state.pausedAccumMs = 0;
    setTransportState('playing');
    if (!sessionTimer) {
      sessionTimer = setInterval(tick, 250);
    }
  }

  function pauseSession() {
    if (!state.running || state.paused) return;
    state.paused = true;
    state.pauseStartMs = Date.now();
    setTransportState('paused');
  }

  function stopSession() {
    if (!state.workout) return;
    if (state.running && !confirm('Arrêter l\'entraînement ?')) return;
    finishSession(true);
  }

  function finishSession(userStopped) {
    if (sessionTimer) { clearInterval(sessionTimer); sessionTimer = null; }
    state.running = false;
    state.paused = false;
    setTransportState('idle');
    const elapsedSec = state.elapsedMs / 1000;
    document.getElementById('finished-summary').textContent =
      (userStopped ? 'Arrêté à ' : 'Durée : ') + Utils.fmtTime(elapsedSec);
    document.getElementById('overlay-finished').classList.remove('hidden');
  }

  function tick() {
    if (!state.workout || !state.running) return;
    if (state.paused) {
      updatePlayerUI();
      return;
    }
    state.elapsedMs = Date.now() - state.sessionStartMs - state.pausedAccumMs;
    const elapsedSec = state.elapsedMs / 1000;
    const total = Blocks.totalDuration(state.workout);
    if (elapsedSec >= total) {
      state.elapsedMs = total * 1000;
      updatePlayerUI();
      finishSession(false);
      return;
    }
    const info = Blocks.blockAtTime(state.workout, elapsedSec);
    if (info && info.index !== state.currentBlockIdx) {
      // Restaurer le style original de l'ancien bloc (si override y était appliqué)
      const prevIdx = state.currentBlockIdx;
      if (prevIdx >= 0) {
        const prevBar = document.querySelector('.timeline-bar[data-index="' + prevIdx + '"]');
        const prevBlock = state.workout.blocks[prevIdx];
        if (prevBar && prevBlock) {
          styleBar(prevBar, prevBlock.level, prevBlock.level, prevBlock.duration);
        }
      }
      state.currentBlockIdx = info.index;
      state.overrideLevel = null;
      if (state.bleConnected) {
        state.driver.setResistanceLevel(info.block.level).catch(function(e){
          console.error('SetRes err', e);
        });
      }
    }
    updatePlayerUI();
  }

  // ============================================================
  // UI UPDATE
  // ============================================================
  function updatePlayerUI() {
    if (!state.workout) return;
    const w = state.workout;
    const total = Blocks.totalDuration(w);
    const elapsedSec = state.elapsedMs / 1000;

    document.getElementById('t-elapsed').textContent = Utils.fmtTime(elapsedSec);

    const info = Blocks.blockAtTime(w, elapsedSec);
    if (info) {
      document.getElementById('block-remaining').textContent = Utils.fmtTime(info.remainingInBlock);
      document.getElementById('block-label').innerHTML =
        'Bloc <strong>' + (info.index + 1) + '/' + w.blocks.length + '</strong> · niveau <strong>' + info.block.level + '</strong>';
      const displayLevel = state.overrideLevel !== null ? state.overrideLevel : info.block.level;
      const resVal = document.getElementById('res-value');
      resVal.textContent = displayLevel;
      resVal.classList.toggle('override', state.overrideLevel !== null);
      document.getElementById('res-override-tag').textContent =
        (state.overrideLevel !== null) ? 'override' : '';
    } else {
      document.getElementById('block-remaining').textContent = '0:00';
      document.getElementById('block-label').textContent = 'Terminé';
    }

    const cursor = document.getElementById('timeline-cursor');
    if (cursor && total > 0) {
      cursor.style.left = (Math.min(100, (elapsedSec / total) * 100)) + '%';
    }
    document.querySelectorAll('.timeline-bar').forEach(function(bar) {
      const idx = parseInt(bar.dataset.index, 10);
      bar.classList.toggle('past', idx < (info ? info.index : w.blocks.length));
      bar.classList.toggle('current', info && idx === info.index);
      // Restyle la barre courante en fonction de l'override actif
      if (info && idx === info.index) {
        const eff = state.overrideLevel !== null ? state.overrideLevel : info.block.level;
        styleBar(bar, eff, info.block.level, info.block.duration);
      }
    });
  }

  /** Applique hauteur, couleur et label d'une barre selon un niveau effectif. */
  function styleBar(bar, effectiveLevel, plannedLevel, durationSec) {
    const heightPct = 8 + (effectiveLevel / 15) * 92;
    bar.style.height = heightPct + '%';
    const hue = 220 - (effectiveLevel - 1) * 14;
    bar.style.background = 'hsl(' + hue + ', 70%, 55%)';
    if (durationSec >= 20) bar.textContent = effectiveLevel;
    else bar.textContent = '';
    // Marqueur visuel "override" si le niveau effectif diffère du prévu
    if (effectiveLevel !== plannedLevel) {
      bar.classList.add('overridden');
    } else {
      bar.classList.remove('overridden');
    }
  }

  function renderTimeline() {
    const tl = document.getElementById('timeline');
    if (!state.workout) return;
    Array.from(tl.querySelectorAll('.timeline-bar')).forEach(function(b){ b.remove(); });
    const total = Blocks.totalDuration(state.workout);
    const cursor = document.getElementById('timeline-cursor');
    state.workout.blocks.forEach(function(b, i) {
      const bar = document.createElement('div');
      bar.className = 'timeline-bar';
      bar.dataset.index = i;
      bar.style.width = ((b.duration / total) * 100) + '%';
      styleBar(bar, b.level, b.level, b.duration);
      tl.insertBefore(bar, cursor);
    });
  }

  // ============================================================
  // CONTRÔLES
  // ============================================================
  document.getElementById('btn-play').addEventListener('click', startSession);
  document.getElementById('btn-pause').addEventListener('click', pauseSession);
  document.getElementById('btn-stop').addEventListener('click', stopSession);

  document.getElementById('btn-res-plus').addEventListener('click', function() {
    if (!state.workout) return;
    const info = Blocks.blockAtTime(state.workout, state.elapsedMs / 1000);
    if (!info) return;
    const current = state.overrideLevel !== null ? state.overrideLevel : info.block.level;
    const next = Math.min(BLE.MAX_LEVEL, current + 1);
    if (next !== current) {
      state.overrideLevel = next;
      if (state.bleConnected) state.driver.setResistanceLevel(next).catch(function(){});
      updatePlayerUI();
    }
  });

  document.getElementById('btn-res-minus').addEventListener('click', function() {
    if (!state.workout) return;
    const info = Blocks.blockAtTime(state.workout, state.elapsedMs / 1000);
    if (!info) return;
    const current = state.overrideLevel !== null ? state.overrideLevel : info.block.level;
    const next = Math.max(BLE.MIN_LEVEL, current - 1);
    if (next !== current) {
      state.overrideLevel = next;
      if (state.bleConnected) state.driver.setResistanceLevel(next).catch(function(){});
      updatePlayerUI();
    }
  });

  document.getElementById('btn-quit').addEventListener('click', function() {
    if (state.running && !confirm('Quitter l\'entraînement en cours ?')) return;
    quitSession();
  });
  document.getElementById('btn-finished-back').addEventListener('click', quitSession);

  function quitSession() {
    if (sessionTimer) { clearInterval(sessionTimer); sessionTimer = null; }
    state.workout = null;
    state.running = false;
    state.paused = false;
    document.getElementById('player-view').classList.remove('active');
    document.getElementById('list-view').style.display = '';
    document.getElementById('overlay-finished').classList.add('hidden');
    document.getElementById('landscape-suggest').classList.remove('show');
  }

  // ============================================================
  // BLE BUTTONS
  // ============================================================
  document.getElementById('btn-connect').addEventListener('click', async function() {
    try {
      await state.driver.connect();
      Toast.success('Connecté');
    } catch (e) {
      Toast.error('Erreur : ' + Utils.describeError(e));
    }
  });
  document.getElementById('btn-disconnect').addEventListener('click', function() {
    state.driver.disconnect();
  });

  // ============================================================
  // IMPORT / EXPORT
  // ============================================================
  document.getElementById('btn-import').addEventListener('click', function() {
    document.getElementById('import-file').click();
  });
  document.getElementById('import-file').addEventListener('change', function(e) {
    const file = e.target.files && e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = function(ev) {
      try {
        const result = Storage.importJson(ev.target.result, 'merge');
        Toast.success(result.imported + ' entraînement(s) importé(s)');
        renderList();
      } catch (err) {
        Toast.error('Erreur import : ' + err.message);
      }
    };
    reader.readAsText(file);
    e.target.value = '';
  });
  document.getElementById('btn-export').addEventListener('click', function() {
    const data = Storage.exportJson();
    const blob = new Blob([data], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const link = document.createElement('a');
    link.href = url;
    const date = new Date().toISOString().slice(0, 10);
    link.download = 'rameur-workouts-' + date + '.json';
    link.click();
    setTimeout(function(){ URL.revokeObjectURL(url); }, 1000);
    Toast.success('Export téléchargé');
  });

  // ============================================================
  // INIT
  // ============================================================
  if (!navigator.bluetooth) {
    document.getElementById('ble-label').innerHTML =
      '⚠ Web Bluetooth indisponible. Sur iPhone, utilise <b>Bluefy</b>.';
    document.getElementById('btn-connect').disabled = true;
  }
  renderList();
})();
</script>
</body>
</html>
